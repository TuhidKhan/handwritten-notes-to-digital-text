services:
  - type: web
    name: handwritten-notes-to-digital-text
    env: python
    plan: free
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: python api.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
