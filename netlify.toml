# Netlify Configuration File

[build]
  # Directory containing the static assets to deploy
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  # Single Page / Static App Routing Fallback
  from = "/*"
  to = "/index.html"
  status = 200
